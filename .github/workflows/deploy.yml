name: Deploy to Lightsail

on:
  workflow_dispatch:
    inputs:
      environment:
        description: '배포 환경'
        required: true
        default: 'production'
        type: choice
        options:
          - production

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.LIGHTSAIL_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.LIGHTSAIL_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy to Lightsail
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.LIGHTSAIL_USERNAME }}@${{ secrets.LIGHTSAIL_HOST }} << 'ENDSSH'
            set -e

            echo "🧹 Cleaning up disk before deploy..."
            echo "Before:"
            df -h /

            # 직전 실패한 git 작업이 남긴 lock 제거 (Out of disk 등으로 만들어진 빈 lock)
            rm -f ~/daepa/.git/index.lock || true

            # Docker: 정지된 컨테이너·dangling 이미지·unused 네트워크/볼륨 회수
            # 현재 사용 중인 이미지는 보존됨
            docker system prune -f || true

            # 7일 이상 사용 안 된 이미지까지 회수 (정기 청소)
            docker image prune -a -f --filter "until=168h" || true

            # 7일 이상 된 오래된 .next 빌드 캐시 제거 (모노레포 누적 방지)
            find ~/daepa -type d -name ".next" -mtime +7 -exec rm -rf {} + 2>/dev/null || true

            # .git 객체 압축 — pack 누적으로 부푸는 것 방지
            (cd ~/daepa && git gc --auto) || true

            echo "After:"
            df -h /

            echo "📦 Pulling latest code..."
            cd ~/daepa
            git fetch origin main
            git reset --hard origin/main

            echo "🔨 Building and restarting containers..."
            docker-compose down
            docker-compose build --no-cache
            docker-compose up -d

            echo "⏳ Waiting for container to start..."
            sleep 10

            echo "🔍 Checking container status..."
            docker-compose ps

            echo "📋 Recent logs:"
            docker-compose logs --tail=50 app

            echo "✅ Deployment completed!"
          ENDSSH

      - name: Health Check
        run: |
          echo "🏥 Running health check..."
          sleep 5
          response=$(curl -s -o /dev/null -w "%{http_code}" http://${{ secrets.LIGHTSAIL_HOST }}:4000/api || echo "000")
          if [ "$response" = "200" ] || [ "$response" = "401" ]; then
            echo "✅ Server is responding (HTTP $response)"
          else
            echo "⚠️ Server response: HTTP $response"
          fi

      - name: Deployment Summary
        run: |
          echo "## 🚀 Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Environment:** ${{ github.event.inputs.environment }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Deployed by:** ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Time:** $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY
