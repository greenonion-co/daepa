name: Production E2E Health Check

on:
  schedule:
    # 매일 한국시간 09:00 (UTC 00:00)에 실행
    - cron: "0 0 * * *"
  workflow_dispatch: # 수동 실행 가능

concurrency:
  group: production-e2e
  cancel-in-progress: true

jobs:
  health-check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - name: Setup Node.js environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install

      - name: Install Playwright browsers
        run: pnpm --filter client exec playwright install --with-deps chromium

      - name: Run Production E2E tests
        run: pnpm --filter client test:e2e:production
        env:
          CI: true
          PRODUCTION_URL: https://breedy.kr

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: production-e2e-report
          path: apps/client/playwright-report/
          retention-days: 7
