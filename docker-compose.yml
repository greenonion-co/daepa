# Lightsail 관리형 데이터베이스 사용
# DB는 외부에서 관리되므로 NestJS 앱만 실행

name: breedy_backend

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.server
    container_name: nestjs_app
    restart: always
    ports:
      - "4000:4000"
    environment:
      - NODE_ENV=production
      - TZ=Asia/Seoul
      - MYSQL_HOST=${MYSQL_HOST}
      - MYSQL_PORT=${MYSQL_PORT}
      - MYSQL_USER=${MYSQL_USER}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - MYSQL_DATABASE=${MYSQL_DATABASE}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
      - OAUTH_REFRESH_SECRET=${OAUTH_REFRESH_SECRET}
      - IMAGE_FILE_SALT=${IMAGE_FILE_SALT}
      - CLIENT_BASE_URL=${CLIENT_BASE_URL}
      - SERVER_BASE_URL=${SERVER_BASE_URL}
      - KAKAO_CLIENT_ID=${KAKAO_CLIENT_ID}
      - KAKAO_CLIENT_SECRET=${KAKAO_CLIENT_SECRET}
      - KAKAO_SERVICE_APP_ADMIN_KEY=${KAKAO_SERVICE_APP_ADMIN_KEY}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - GOOGLE_CLIENT_ID_WEB=${GOOGLE_CLIENT_ID_WEB}
      - GOOGLE_CLIENT_ID_IOS=${GOOGLE_CLIENT_ID_IOS}
      - NAVER_CLIENT_ID=${NAVER_CLIENT_ID}
      - NAVER_CLIENT_SECRET=${NAVER_CLIENT_SECRET}
      - CLOUDFLARE_R2_IMAGE_BUCKET_NAME=${CLOUDFLARE_R2_IMAGE_BUCKET_NAME}
      - CLOUDFLARE_R2_IMAGE_BASE_URL=${CLOUDFLARE_R2_IMAGE_BASE_URL}
      - CLOUDFLARE_R2_API_BASE_URL=${CLOUDFLARE_R2_API_BASE_URL}
      - CLOUDFLARE_R2_ACCESS_KEY_ID=${CLOUDFLARE_R2_ACCESS_KEY_ID}
      - CLOUDFLARE_R2_SECRET_ACCESS_KEY=${CLOUDFLARE_R2_SECRET_ACCESS_KEY}
      - APPLE_CLIENT_ID=${APPLE_CLIENT_ID}
      - APPLE_TEAM_ID=${APPLE_TEAM_ID}
      - APPLE_KEY_ID=${APPLE_KEY_ID}
      - APPLE_PRIVATE_KEY=${APPLE_PRIVATE_KEY}
      - FIREBASE_SERVICE_ACCOUNT_PATH=${FIREBASE_SERVICE_ACCOUNT_PATH}
    volumes:
      - ./apps/server/firebase-service-account.json:/app/apps/server/firebase-service-account.json:ro
